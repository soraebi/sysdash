[project]
name = "sysdash"
version = "1.0.0"
description = "クロスプラットフォームCLIシステムモニタダッシュボード(CPU/メモリ/ディスク/ネットワーク)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "sysdash contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "psutil>=7.2.2",
    "textual>=8.2.8,<9",
    "textual-plotext>=1.0.1,<1.1",
]

[project.scripts]
sysdash = "sysdash.__main__:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
